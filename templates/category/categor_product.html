{% extends "index.html" %}
{% block base %}
  <main class="max-w-[1280px] mx-auto px-4 sm:px-6 md:px-lg py-6 md:py-xl">
    <!-- Section Header -->
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end justify-between mb-6 md:mb-xl">
      <div>

        <h1 class="font-h1 text-h1 text-on-surface tracking-tight">{{ category.name|upper }}</h1>
        <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Showing 1-12 of 48 products</p>
      </div>
      <div class="flex items-center flex-1 max-w-md">
  <div class="relative w-full">
    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
      <svg class="w-4 h-4 text-on-surface-variant" aria-hidden="true" xmlns="http://w3.org" fill="none" viewBox="0 0 20 20">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
      </svg>
    </div>
    <input 
      type="search" 
      class="block w-full p-2 pl-10 bg-white border border-outline-variant rounded-lg shadow-sm text-label-md focus:ring-primary focus:border-primary placeholder-on-surface-variant" 
      placeholder="Search items..." 
      required
    >
  </div>
</div>

    </div>

    <!-- Product Grid: fully responsive using Tailwind classes (xs:1, sm:2, md:3, xl:4) -->
<div class="grid grid-cols-2 p-0 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-1 sm:gap-3 md:gap-4 lg:gap-5">
  <!-- Product Card 1 -->
   
   
   
   {% for i in products %}
   
  <div class="group bg-white rounded-xl product-card-shadow border border-slate-200/80 transition-all duration-300 overflow-hidden flex flex-col h-full hover:shadow-lg">
    <div class="aspect-square relative overflow-hidden bg-surface-container">
      <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="{{ i.image.url}}" alt="Minimalist Quartz Watch">
      <div class="hidden absolute top-2 right-2 sm:top-3 sm:right-3">
        <button class="w-7 h-7 sm:w-8 sm:h-8 bg-white/90 backdrop-blur-sm rounded-full flex items-center justify-center text-on-surface-variant hover:text-red-500 transition-all shadow-sm active:scale-95"><span class="material-symbols-outlined text-[16px] sm:text-[18px]"></span></button>
      </div>
    </div>
    <div class="p-2 sm:p-2.5 md:p-3 flex flex-col flex-1">
      <div class="flex items-center gap-0.5 sm:gap-1 mb-0.5 sm:mb-1">
        <span class="material-symbols-outlined text-[11px] sm:text-[12px] md:text-[14px] text-amber-500" style="font-variation-settings:'FILL'1">star</span>
        <span class="text-[10px] sm:text-[11px] md:text-[12px] text-gray-600">4.8 (120)</span>
      </div>
      <h3 class="text-[12px] sm:text-[13px] md:text-[14px] font-semibold text-gray-800 line-clamp-1">{{ i.Name }}</h3>
      <div class="flex items-center justify-between mt-2 sm:mt-2.5 md:mt-3 gap-1 flex-wrap">
        <span class="text-[15px] sm:text-[16px] md:text-[18px] lg:text-[20px] font-bold text-gray-900">{{ i.Price }}</span>
        <a href="{% url 'product_detail' id=i.id %}">
          <button class="bg-blue-600 text-white px-2 py-1 sm:px-2.5 sm:py-1 md:px-3 md:py-1.5 rounded-lg text-[10px] sm:text-[11px] md:text-[12px] hover:bg-blue-700 transition-all active:scale-95 shadow-sm whitespace-nowrap">Order Now</button>
        </a>
      </div>
    </div>
  </div>
  {% endfor %}
  
</div>

    <!-- Pagination -->
    <div class="mt-12 md:mt-16 flex justify-center items-center gap-2 flex-wrap">
      <button class="w-9 h-9 md:w-10 md:h-10 flex items-center justify-center rounded-lg border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-[18px]">chevron_left</span></button>
      <button class="w-9 h-9 md:w-10 md:h-10 flex items-center justify-center rounded-lg bg-primary text-white font-label-md">1</button>
      <button class="w-9 h-9 md:w-10 md:h-10 flex items-center justify-center rounded-lg border border-outline-variant hover:bg-surface-container font-label-md">2</button>
      <button class="w-9 h-9 md:w-10 md:h-10 flex items-center justify-center rounded-lg border border-outline-variant hover:bg-surface-container font-label-md">3</button>
      <span class="px-1 text-outline">...</span>
      <button class="w-9 h-9 md:w-10 md:h-10 hidden xs:flex items-center justify-center rounded-lg border border-outline-variant hover:bg-surface-container font-label-md">8</button>
      <button class="w-9 h-9 md:w-10 md:h-10 flex items-center justify-center rounded-lg border border-outline-variant hover:bg-surface-container"><span class="material-symbols-outlined text-[18px]">chevron_right</span></button>
    </div>
  </main>

  {% endblock base %}
